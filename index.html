<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#82445e">

  <title>Flowy | When elegance meets comfort</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #82445e;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Georgia, "Times New Roman", serif;
      color: #fff0d5;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(30px, env(safe-area-inset-top))
        24px
        max(30px, env(safe-area-inset-bottom));

      background:
        linear-gradient(
          rgba(91, 42, 65, 0.10),
          rgba(91, 42, 65, 0.20)
        ),
        url(/images/background.jpeg) center center / cover no-repeat;
    }

    .content {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(86%, 350px);
      max-height: 28vh;
      object-fit: contain;
      margin-bottom: 18px;
      background: transparent;
    }

    .tagline {
      font-size: clamp(13px, 3.8vw, 18px);
      font-weight: normal;
      letter-spacing: 0.17em;
      line-height: 1.8;
      margin-bottom: clamp(48px, 8vh, 75px);
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .social-link {
      min-height: 64px;
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr 22px;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;

      border: 1px solid rgba(255, 240, 213, 0.85);
      border-radius: 999px;
      color: #fff0d5;
      background: rgba(255, 240, 213, 0.08);

      text-decoration: none;
      font-size: 15px;
      letter-spacing: 0.12em;

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, transform 0.2s;
    }

    .social-link:active {
      transform: scale(0.97);
      background: rgba(255, 240, 213, 0.22);
    }

    .social-link span {
      text-align: center;
    }

    .social-link svg {
      width: 27px;
      height: 27px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-link .arrow {
      width: 22px;
      height: 22px;
      justify-self: end;
    }

    @media (max-height: 650px) {
      .page {
        padding-top: max(20px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }

      .logo {
        max-height: 21vh;
        margin-bottom: 10px;
      }

      .tagline {
        margin-bottom: 28px;
      }

      .links {
        gap: 12px;
      }

      .social-link {
        min-height: 56px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content">

      <!-- Your transparent Flowy logo -->
      <img
        class="logo"
        src="/images/Elegant Flowy Cursive Lettering.png"
        alt="Flowy"
      >

      <p class="tagline">
        When elegance meets comfort
      </p>

      <nav class="links" aria-label="Flowy social links">

        <!-- Replace with your Instagram page URL -->
        <a
          class="social-link"
          href="https://www.instagram.com/flowyy.design?xtok=d3Z0Z241NmVkNzAz"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8"
                    fill="currentColor" stroke="none"/>
          </svg>

          <span>Instagram</span>

          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h15"/>
            <path d="m13 5 7 7-7 7"/>
          </svg>
        </a>

        <!-- Replace with your WhatsApp group invite URL -->
        <a
          class="social-link"
          href="https://chat.whatsapp.com/E7ImphScxTlEnuKeTucv8R?s=sw&p=a&mlu=4&ilr=4"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 11.7a8.2 8.2 0 0 1-12.1 7.2L3 20l1.2-4.8a8.2 8.2 0 1 1 16-3.5Z"/>
            <path d="M8.5 7.8c.3-.5.6-.5.9-.5h.4c.2 0 .4.1.5.4l.8 1.8c.1.3.1.5-.1.7l-.6.7c-.2.2-.2.4 0 .7.5.9 1.3 1.6 2.2 2.1.3.2.5.2.7-.1l.8-.9c.2-.3.5-.3.8-.2l1.7.8c.3.1.4.3.4.5 0 .3-.2 1.2-.8 1.6-.5.5-1.2.7-2 .5-1-.2-2.2-.7-3.6-1.9-1.7-1.5-2.7-3.3-3-4.4-.3-1.1.2-1.8.9-2.3Z"/>
          </svg>

          <span>WhatsApp</span>

          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h15"/>
            <path d="m13 5 7 7-7 7"/>
          </svg>
        </a>

      </nav>
    </section>
  </main>
</body>
</html>
